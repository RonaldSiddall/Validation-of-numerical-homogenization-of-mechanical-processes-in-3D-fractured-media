# This .yaml file is used, for now, as a config file for the .py file that computes delta_iso
# of each tensor within the piece constant tensor field
# The .py file is used to analyse the distance of the elastic tensor field from isotropy

# the field files upscale_m writes for Flow123d, {label: path}; the label names the output folder
fields:
    kubc: runs/original_summer_data/chain/kubc/macro_elastic_tensor.msh2
    subc: runs/original_summer_data/chain/subc/macro_elastic_tensor.msh2

# results: <out>/<label>/delta_iso_per_element.txt, summary_all_delta_iso.txt
out: runs/original_summer_data/macro_tensor_isotropy

# name prefix of the six fields, as in the upscale_m config (mechanics_macroscale.tensor_field_name_prefix)
field_prefix: stiffness_tensor_

# an element is isotropic if delta_iso <= tol_rel
tol_rel: 1.0e-6
